services:
  - type: web
    name: mholly-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: mholly.development@gmail.com
